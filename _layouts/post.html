---
layout: default
---
<div class="page-head">
  <div class="wrap">
    <a class="back-link" href="{{ '/' | relative_url }}">&larr; Home</a>
    <h1>{{ page.title }}</h1>
    <div class="meta-row">
      <span class="badge badge-plain"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></span>
    </div>
  </div>
</div>

<div class="section">
  <div class="wrap-narrow">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</div>
