<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">

{% seo %}
{% feed_meta %}

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate icon" href="{{ '/assets/img/favicon.svg' | relative_url }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": {{ site.title | jsonify }},
  "url": {{ site.url | append: site.baseurl | jsonify }},
  "description": {{ site.description | jsonify }},
  "logo": {{ site.url | append: site.baseurl | append: '/assets/img/og.png' | jsonify }},
  "foundingLocation": {
    "@type": "Place",
    "address": { "@type": "PostalAddress", "addressLocality": "Prague", "addressCountry": "CZ" }
  },
  "sameAs": [
    "https://github.com/BSD-CZ",
    "https://github.com/SoCBSD"
  ]
}
</script>
